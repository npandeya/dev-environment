global:
  resolve_timeout: 5m
inhibit_rules:
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = critical
  target_matchers:
  - severity =~ warning|info
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = warning
  target_matchers:
  - severity = info
- equal:
  - namespace
  source_matchers:
  - alertname = InfoInhibitor
  target_matchers:
  - severity = info
receivers:
- name: "null"
- name: 'slack-notification'
  slack_configs:
      - api_url: 'https://hooks.slack.com/services/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'
        channel: '#devesecops-engineering-pilot-class'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} - {{ .Status }}'
        text: '{{ .CommonAnnotations.description }}'
route:
  group_by:
  - namespace
  group_interval: 5m
  group_wait: 30s
  receiver: "null"
  repeat_interval: 12h
  routes:
  - matchers:
    - alertname =~ "InfoInhibitor|Watchdog"
    receiver: "null"
  - match:
      alert: 'slack'
    receiver: 'slack-notification'

templates:
- /etc/alertmanager/config/*.tmpl